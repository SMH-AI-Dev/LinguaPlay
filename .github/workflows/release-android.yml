name: LinguaPlay Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    name: Build and sign Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify web production build
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LINGUAPLAY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing LINGUAPLAY_ANDROID_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/linguaplay-release.jks"
          test -s "$RUNNER_TEMP/linguaplay-release.jks"

      - name: Configure Gradle signing
        env:
          LINGUAPLAY_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/linguaplay-release.jks
          LINGUAPLAY_ANDROID_STORE_PASSWORD: ${{ secrets.LINGUAPLAY_ANDROID_STORE_PASSWORD }}
          LINGUAPLAY_ANDROID_KEY_ALIAS: ${{ secrets.LINGUAPLAY_ANDROID_KEY_ALIAS }}
          LINGUAPLAY_ANDROID_KEY_PASSWORD: ${{ secrets.LINGUAPLAY_ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.mjs

      - name: Build signed APK and AAB
        working-directory: android
        env:
          LINGUAPLAY_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/linguaplay-release.jks
          LINGUAPLAY_ANDROID_STORE_PASSWORD: ${{ secrets.LINGUAPLAY_ANDROID_STORE_PASSWORD }}
          LINGUAPLAY_ANDROID_KEY_ALIAS: ${{ secrets.LINGUAPLAY_ANDROID_KEY_ALIAS }}
          LINGUAPLAY_ANDROID_KEY_PASSWORD: ${{ secrets.LINGUAPLAY_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linguaplay-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
